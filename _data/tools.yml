- name: eGo
  description: With eGo, an integrated optimization of flexibility options and grid extension is assessed by linking transmission grid planning of [eTraGo](https://etrago.readthedocs.io) with distribution grid planning of [eDisGo](https://edisgo.readthedocs.io).
