- name: Use Case 1
  title: Regional planning
  id: usecase1
  short: Identifying suitable regional transformation paths in cooperation with local stakeholders.
  description: The ongoing transformation of the energy system is leading to a diversification of stakeholders. This can be partly explain due to the shift from centralized large scale fossil fuel power plants, owned by large enterprises, to decentralized renewable energy sources, owned by a variety of individuals depending on its scale. Stakeholders at the municipal and district levels play an increasingly important role in the current transformation's success. Therefore, sound knowledge of possible future developments in the regional energy system and its interactions with the supra-regional energy system is of utmost importance for forward-looking regional planning. Furthermore, the effects of transitioning to a 100 % renewable energy supply in the electricity, heating, and transportation sectors pose challenges for all regions in Germany.  Due to structural differences between the regions regional energy demand and generation patterns vary, which lead to different requirements for the respective regional transformation. This use case aims to enable local stakeholders to identify suitable transformation paths for their region and derive recommendations for a successful transformation. Additionally it aims to identify and utilize synergies between districts with different structures.
  research_question:
    - "How is local demand for electricity (and hydrogen) developing?"
    - "What costs and expansion requirements for grids and storage facilities will this lead to?"
    - "How will large-scale consumers (e.g. data centers, decarbonization plants) influence costs and expansion requirements?"
    - "How can flexibilization of new consumers efficiently reduce costs and expansion requirements?"
  industrial_partners: Different county administrations
  scientific_lead:
    - Flensburg Universtity of Applied Sciences
    - University of Flensburg
  icon: mstile-144x144.png
- name: Use Case 2
  title: Electricity and heating transition
  id: usecase2
  short: Investigating the impact of heat transition paths on local and supra-regional electrical grids.
  description: Decarbonizing the heat supply presents multiple challenges for municipal energy suppliers. Heating grids require a climate-neutral central energy supply . Decentralized heat supply using private heat pumps creates new requirements for the electricity grid as new electrical demands and consumption patterns arise, further complicated through decentralized generation (e.g., rooftop PV systems). Additionally, there are requirements for renewable electrical decentralized generation, as well as new requirements due to the growing electrification of the transportation sector. Model-based analyses of local and regional electricity grids through the reGon model are important for holistically evaluating heat supply strategies and their impacts. The model provides a cross-sectoral view of electricity, heat, and gas, making it possible to answer questions about the future interaction of various types of infrastructures. This allows municipal energy suppliers to plan their plants and infrastructures more effectively and identify potential flexibility and requirements. The increasing volume of decentralized energy generation is changing the interaction between distribution and transmission grids and their respective operators. Consequently, considering the overlying and adjacent grid areas has gained significance, especially given the high flexibility potential available in the lower voltage levels. Municipal energy suppliers are knowledgeable about their own grid area but often lack information about overlying and neighboring grid areas. The reGon project aims to address this issue by providing relevant stakeholders with data models and tools to examine their local systems while considering the overlaying system.
  research_question:
  - "How is local electricity and heat generation developing?"
  - "What expansion requirements will arise with future electrified heat and power generation plants on regional and supra-regional power grids?"
  - "How can flexible use of electricity and heating reduce  expansion requirements?"
  industrial_partners: Municipal energy suppliers
  scientific_lead:
    - University of Flensburg
    - Flensburg Universtity of Applied Sciences
  icon: mstile-144x144.png
