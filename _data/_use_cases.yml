- name: use case 4
  title: Integrated use of flexibilities across grid Levels
  id: usecase4
  short: What is the potential for TSOs to use flexibilities inside the distribution grid?
  description: The goal of the reGon project is to bring our tools and datasets into practical application. They are tested in five use cases carried out in close collaboration with practice partners. Together, we define scenario assumptions and validate the results, ensuring that our partners’ requirements are directly reflected in the usability and functionality of the tools.
  research_question:
    - "To what extent does a potential flexibility utilization by a DSO create synergy effects in the higher voltage levels?"
    - "What is the useable potential of flexibility in the distribution grid for TSOs after it has been used by DSOs?"
    - "What impact does a TSO flexibility usage have on the distribution grid?"
  industrial_partners: Transmission System Operator, Distribution System Operator
  scientific_lead: Reiner Lemoine Institut
