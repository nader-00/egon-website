- name: Use Case 1
  title: Regional planning
  id: usecase1
  short: Supporting regional stakeholders in identifying suitable transformation paths
  description: The shift from centralized fossil fuel power plants to decentralized renewable energy sources is diversifying the stakeholder landscape, with municipal and district-level actors playing an increasingly important role. Regional differences in energy demand and generation patterns mean that transformation requirements vary significantly across areas, making sound knowledge of future regional energy system developments essential for forward-looking planning. We provide data models and tools that enable local stakeholders to analyse their regional energy system in the context of the broader supra-regional system, identify suitable transformation paths, and derive concrete planning recommendations.
  research_question:
    - "How is local demand for electricity (and hydrogen) developing?"
    - "What costs and expansion requirements for grids and storage facilities will this lead to?"
    - "How will large-scale consumers (e.g. data centers, decarbonization plants) influence costs and expansion requirements?"
    - "How can flexibilization of new consumers efficiently reduce costs and expansion requirements?"
  industrial_partners: Different county administrations
  scientific_lead:
    - Flensburg Universtity of Applied Sciences
    - University of Flensburg
  icon: mstile-144x144.png
- name: Use Case 2
  title: Electricity and heating transition
  id: usecase2
  short: Enabling municipalities to holistically plan heat supply decarbonisation.
  description: "Decarbonizing heat supply poses significant challenges for municipal energy suppliers: heating grids require climate-neutral central energy sources, while the electrification of heat and transport creates new demands and consumption patterns in distribution grids. At the same time, growing decentralized generation is reshaping the interaction between distribution and transmission grids. Municipal energy suppliers typically have detailed knowledge of their own grid area but lack visibility into overlying and neighbouring systems. Through cross-sectoral modelling of electricity, heat, and gas, we provide municipal stakeholders with the tools to holistically evaluate heat supply strategies, identify flexibility potential, and plan infrastructure with full awareness of the broader system context."
  research_question:
  - "How is local electricity and heat generation developing?"
  - "What expansion requirements will arise with future electrified heat and power generation plants on regional and supra-regional power grids?"
  - "How can flexible use of electricity and heating reduce  expansion requirements?"
  industrial_partners: Municipal energy suppliers
  scientific_lead:
    - University of Flensburg
    - Flensburg Universtity of Applied Sciences
  icon: mstile-144x144.png
- name: Use Case 3
  title: Resilience of Future Energy Systems
  id: usecase3
  short: Providing energy system planners with information on the influence of extreme external conditions.
  description: Future energy systems must not only be efficient and climate-neutral, but also resilient to long-term changes and external disturbances. Climate change, import restrictions, and market price fluctuations can significantly influence energy demand, renewable generation, and overall system stability. We analyse different climate and weather scenarios by integrating historical and projected weather data, assessing how variations in temperature, solar radiation, and other climate-related factors affect energy supply and demand. This allows us to evaluate the robustness of future energy systems under different stress scenarios and identify strategies that strengthen system resilience.
  research_question:
  - "How does climate change influence energy demand and renewable energy generation patterns?"
  - "How robust are future energy systems under different weather and climate scenarios?"
  - "How do external disturbances such as import restrictions or market price fluctuations affect system operation?"
  industrial_partners: Transmission System Operator (TSO), Distribution System Operator (DSO), European non-governmental organization (NGO)
  scientific_lead: DLR Institute of Networked Energy Systems
  icon: mstile-144x144.png
- name: Use Case 4
  title: Integrated use of flexibilities across grid levels (Redispatch)
  id: usecase4
  short:  Helping grid operators to quantify the value of distribution grid flexibilities for redispatch provision.
  description: Structural imbalances between electricity generation in the north and consumption in the south, combined with insufficient grid expansion, will continue to drive significant redispatch needs. While dedicated assets such as gas and hydrogen power plants or large-scale battery storage can meet these needs, small-scale flexibilities (SSF) from the distribution grid like heat pumps, home batteries, and electric vehicles offer particular potential, as they already exist in large numbers and could reduce the need for new redispatch infrastructure. We analyse the system-wide value of integrating SSF into redispatch, providing spatially and temporally resolved insights into flexibility potential across distribution grids to support both DSOs and TSOs in coordinating flexibility use across grid levels.
  research_question:
    - "What is the impact of SSF in redispatch on the buildout of electrolysers, large-scale battery storage, and power plants etc.?"
    - "What additional stress and expansion costs arise in distribution grids from SSF participation in redispatch?"
    - "How do SSF in redispatch affect the overall costs of energy system transformation?"
  industrial_partners: Transmission System Operator, Distribution System Operator
  scientific_lead: Reiner Lemoine Institut
  icon: mstile-144x144.png
- name: Use Case 5
  title: Integrated use of flexibilities across grid levels
  id: usecase5
  short: Preparing DSOs for secure grid operation and expansion cost reduction.
  description: The ongoing integration of heat pumps, electric vehicles, battery storage, and distributed renewable generation into medium- and low-voltage grids is creating new operational and planning challenges for DSOs, which will intensify as electrification continues to expand. Ensuring secure grid operation while limiting infrastructure expansion costs requires a clear understanding of how different operational and reinforcement strategies perform under future conditions. We quantify the impact of flexibility-based control and targeted grid reinforcement on system security and total costs, with a particular focus on demand control under §14a EnWG (German Energy Industry Act).
  research_question:
     - "How can available flexibilities be used to support secure operation in medium- and low-voltage grids?"
     - "To what extent can flexibility use and renewable curtailment reduce future infrastructure expansion needs?"
  industrial_partners: Distribution system operator
  scientific_lead: University of Magdeburg
  icon: mstile-144x144.png