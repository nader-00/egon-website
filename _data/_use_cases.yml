- name: Use Case 4
  title: Integrated use of flexibilities across grid levels
  id: usecase4
  short: What is the potential for TSOs to use flexibilities inside the distribution grid?
  description: Flexibilities are becoming increasingly important for the efficient operation of electricity grids. A large share of available flexibilities will be located in the distribution grid, such as heat pumps, home batteries, and electric vehicles. Both DSOs and TSOs have a strong interest in making use of these flexibilities to prevent grid congestion and reduce the need for grid expansion. To support system operators in coordinating flexibility use across different grid levels, we provide detailed information on the flexibility potential of various technologies, with high spatial and temporal resolution.
  research_question:
    - "To what extent does a potential flexibility utilization by a DSO create synergy effects in the higher voltage levels?"
    - "What is the usable potential of flexibility in the distribution grid for TSOs after it has been used by DSOs?"
    - "What impact does a TSO flexibility usage have on the distribution grid?"
  industrial_partners: Transmission System Operator, Distribution System Operator
  scientific_lead: Reiner Lemoine Institut
