<div class="columns">
  <div class="use-cases-grid">
    {% for uc in site.data._use_cases %}
      <div class="use_cases__item">
        <div class="use_cases__upper--helper"></div>
        <div class="use_cases__upper">
          <h2 class="use_cases__name"><a href="#{{ uc.id }}">{{ uc.name }} - {{uc.title}}</a></h2>
          <img src="{{ site.url }}{{ site.baseurl }}/assets/favicon/{{ uc.icon }}" alt="Use Case Logo" class="use_case-icon" />
        </div>
        <div class="use_cases__bottom">
          <p class="use_cases__text">{{ uc.short | markdownify }}</p>
          <div class="use_cases__link">
            <a href="#{{ uc.id }}">More information</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
