<section class="contact-form-section">
  <div class="columns network-contact__partners-heading">
    <h2>Write Us</h2>
  </div>
  <div class="columns">
    <p class="contact-form__intro">You can reach us directly via the form below.</p>
    <form id="contact-form" novalidate>
      <input type="hidden" name="access_key" value="{{ site.env.WEB3FORMS_ACCESS_KEY }}">
      <input type="hidden" name="subject" value="New message via reGon website">
      <!-- Honeypot: bots fill this, humans don't -->
      <input type="checkbox" name="botcheck" class="contact-form__honeypot" tabindex="-1" autocomplete="off">

      <div class="contact-form__group">
        <label for="contact-name" class="contact-form__label">Name</label>
        <input
          type="text"
          id="contact-name"
          name="name"
          class="contact-form__input"
          placeholder="Your name"
          autocomplete="name"
        >
      </div>

      <div class="contact-form__group">
        <label for="contact-email" class="contact-form__label">Email</label>
        <input
          type="email"
          id="contact-email"
          name="email"
          class="contact-form__input"
          placeholder="your@email.com"
          autocomplete="email"
        >
        <span class="contact-form__error" id="email-error">Please enter a valid email address.</span>
      </div>

      <div class="contact-form__group">
        <label for="contact-message" class="contact-form__label">Message</label>
        <textarea
          id="contact-message"
          name="message"
          class="contact-form__input contact-form__textarea"
          placeholder="Your message"
          rows="5"
        ></textarea>
      </div>

      <div class="contact-form__footer">
        <button type="submit" id="contact-submit" class="contact-form__submit" disabled>
          Send Message
        </button>
        <p class="contact-form__status" id="contact-status" aria-live="polite"></p>
      </div>
    </form>
  </div>
</section>

<script>
(function () {
  var EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  var form      = document.getElementById('contact-form');
  var nameEl    = document.getElementById('contact-name');
  var emailEl   = document.getElementById('contact-email');
  var msgEl     = document.getElementById('contact-message');
  var submitBtn = document.getElementById('contact-submit');
  var statusEl  = document.getElementById('contact-status');
  var emailErr  = document.getElementById('email-error');

  function updateSubmitState() {
    var nameOk  = nameEl.value.trim().length > 0;
    var emailOk = EMAIL_REGEX.test(emailEl.value.trim());
    var msgOk   = msgEl.value.trim().length > 0;

    submitBtn.disabled = !(nameOk && emailOk && msgOk);

    if (emailEl.dataset.touched) {
      emailErr.style.display = emailOk ? 'none' : 'block';
      emailEl.classList.toggle('contact-form__input--error', !emailOk);
    }
  }

  emailEl.addEventListener('blur', function () {
    emailEl.dataset.touched = 'true';
    updateSubmitState();
  });

  [nameEl, emailEl, msgEl].forEach(function (el) {
    el.addEventListener('input', updateSubmitState);
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    statusEl.textContent = '';
    statusEl.className = 'contact-form__status';

    var data = new FormData(form);

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: data
    })
    .then(function (res) { return res.json(); })
    .then(function (json) {
      if (json.success) {
        statusEl.textContent = 'Thank you! Your message has been sent.';
        statusEl.classList.add('contact-form__status--success');
        form.reset();
        emailEl.dataset.touched = '';
        emailErr.style.display = 'none';
        emailEl.classList.remove('contact-form__input--error');
      } else {
        throw new Error(json.message || 'Submission failed.');
      }
    })
    .catch(function () {
      statusEl.textContent = 'Something went wrong. Please try again or contact us directly by email.';
      statusEl.classList.add('contact-form__status--error');
    })
    .finally(function () {
      submitBtn.textContent = 'Send Message';
      updateSubmitState();
    });
  });
})();
</script>
